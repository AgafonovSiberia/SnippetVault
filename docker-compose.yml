x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "1m"
    max-file: "1"
    tag: "{{.Name}}"

services:
  backend:
    container_name: vault_backend
    env_file:
      - .env
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: on-failure
    networks:
      - vault-network
    depends_on:
      migrations:
        condition: service_completed_successfully
    logging: *default-logging
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      logging: "promtail"
      logging_jobname: "containerlogs"
      traefik.enable: "true"
      traefik.http.routers.gateway.rule: "Host(`${SERVER_HOST}`) && PathPrefix(`/api`)"
      traefik.http.routers.gateway.entrypoints: "websecure"
      traefik.http.routers.gateway.tls: "true"
      traefik.http.routers.gateway.tls.certresolver: "letsencrypt"
      traefik.http.services.gateway.loadbalancer.server.port: "8000"

  web:
    container_name: vault_web
    build:
      context: ./web/
      dockerfile: Dockerfile
      target: prod
    restart: on-failure
    networks:
      - vault-network
    logging: *default-logging
    env_file:
      - .env
      - ./web/.env
    labels:
      logging: "promtail"
      logging_jobname: "containerlogs"
      traefik.enable: "true"
      traefik.http.routers.frontend.rule: "Host(`${SERVER_HOST}`)"
      traefik.http.routers.frontend.entrypoints: "websecure"
      traefik.http.routers.frontend.tls: "true"
      traefik.http.routers.frontend.tls.certresolver: "letsencrypt"
      traefik.http.services.frontend.loadbalancer.server.port: "80"

  migrations:
    container_name: vault_migrations
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/app/migrations
    env_file:
      - .env
    command: [ "uv", "run", "alembic", "-c", "alembic.ini", "upgrade", "head" ]
    networks:
      - vault-network

  postgres:
    container_name: vault_postgres
    image: postgres:18.0
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:6666:5432"
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - vault-network

  traefik:
    image: traefik:v3.6.6
    container_name: traefik
    env_file:
      - .env
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false

      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https

      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json

      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - vault-network
    restart: always

volumes:
  postgres_data:
  traefik_letsencrypt:


networks:
  vault-network:
    external: true
    name: vault
